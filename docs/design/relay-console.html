<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMC³ Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* One page = one agent run. The execution graph is the hero:
   You -> Orchestrator (depth 0) -> Specialists (depth 1) -> Tool calls (via the gateway).
   Under it, a lane timeline replaces the text event log. Then output and recent runs. */
:root {
  --bg: #f4f4f1; --surface: #ffffff; --surface-2: #f9f9f7; --line: #e6e5e0; --line-2: #d8d7d1;
  --ink: #0c0c0d; --ink-2: #46474c; --ink-3: #8c8d92; --hover: rgba(12, 12, 13, .04);
  --solid: #0c0c0d; --solid-fg: #ffffff;
  --accent: #0a6fd6; --accent-soft: rgba(10, 111, 214, .1);
  --ok: #0c9a61; --ok-soft: rgba(12, 154, 97, .1);
  --err: #d92d20; --err-soft: rgba(217, 45, 32, .08);
  --stage: #fbfbf9; --dot: rgba(12, 12, 13, .08);
  --node-sh: 0 1px 0 rgba(12, 12, 13, .03), 0 8px 24px -14px rgba(12, 12, 13, .22);
  --pop: 0 30px 80px -24px rgba(0, 0, 0, .28), 0 0 0 1px var(--line);
  --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #07070a; --surface: #0e0e11; --surface-2: #131317; --line: #1d1d22; --line-2: #2a2a31;
    --ink: #f3f3f4; --ink-2: #b2b3b9; --ink-3: #6c6d74; --hover: rgba(255, 255, 255, .04);
    --solid: #f3f3f4; --solid-fg: #07070a;
    --accent: #3b9eff; --accent-soft: rgba(59, 158, 255, .14);
    --ok: #2fd38a; --ok-soft: rgba(47, 211, 138, .11);
    --err: #ff5b50; --err-soft: rgba(255, 91, 80, .1);
    --stage: #0a0a0d; --dot: rgba(255, 255, 255, .06);
    --node-sh: 0 12px 32px -14px rgba(0, 0, 0, .8);
    --pop: 0 30px 80px -24px rgba(0, 0, 0, .8), 0 0 0 1px var(--line);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #07070a; --surface: #0e0e11; --surface-2: #131317; --line: #1d1d22; --line-2: #2a2a31;
  --ink: #f3f3f4; --ink-2: #b2b3b9; --ink-3: #6c6d74; --hover: rgba(255, 255, 255, .04);
  --solid: #f3f3f4; --solid-fg: #07070a;
  --accent: #3b9eff; --accent-soft: rgba(59, 158, 255, .14);
  --ok: #2fd38a; --ok-soft: rgba(47, 211, 138, .11);
  --err: #ff5b50; --err-soft: rgba(255, 91, 80, .1);
  --stage: #0a0a0d; --dot: rgba(255, 255, 255, .06);
  --node-sh: 0 12px 32px -14px rgba(0, 0, 0, .8);
  --pop: 0 30px 80px -24px rgba(0, 0, 0, .8), 0 0 0 1px var(--line);
}
@property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink-2); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lucide { width: 16px; height: 16px; flex: none; stroke-width: 1.6; }
.mono { font-family: var(--mono); }
sup { font-size: .6em; line-height: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: border-color .2s, transform .2s var(--ease), opacity .2s; }
.btn:hover { border-color: var(--ink-3); }
.btn:active { transform: scale(.98); }
.btn.solid { background: var(--solid); color: var(--solid-fg); border-color: var(--solid); }
.btn.solid:hover { opacity: .88; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); }
.btn.ghost:hover { color: var(--ink); background: var(--hover); }
.btn .lucide { width: 15px; height: 15px; }
.ibtn { width: 38px; height: 38px; display: inline-grid; place-items: center; border: 0; border-radius: 10px; background: transparent; color: var(--ink-3); cursor: pointer; transition: background .2s, color .2s; text-decoration: none; position: relative; }
.ibtn:hover { background: var(--hover); color: var(--ink); }
kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; line-height: 18px; border: 1px solid var(--line-2); border-radius: 4px; color: var(--ink-3); }

/* Tooltips from data-tip, used by the rail and the timeline. */
[data-tip] { position: relative; }
[data-tip]:hover::after { content: attr(data-tip); position: absolute; z-index: 50; pointer-events: none; white-space: nowrap; padding: 5px 8px; border-radius: 6px; background: var(--solid); color: var(--solid-fg); font: 500 11.5px var(--mono); }
.rail [data-tip]:hover::after { left: calc(100% + 10px); top: 50%; transform: translateY(-50%); }
.ln [data-tip]:hover::after { bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); }

/* ---------- Shell: icon rail + page ---------- */
.app { display: grid; grid-template-columns: 64px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 16px 0 14px; border-right: 1px solid var(--line); background: var(--bg); z-index: 40; }
.mark { position: relative; overflow: hidden; width: 34px; height: 34px; border-radius: 9px; background: var(--solid); color: var(--solid-fg); display: grid; place-items: center; font: 600 12px var(--sans); margin-bottom: 14px; }
.mark span { position: relative; z-index: 1; }
.mark::after { content: ""; position: absolute; right: -1px; top: -1px; width: 16px; height: 16px; clip-path: polygon(0 0, 100% 0, 100% 100%); background: linear-gradient(135deg, #ff6900, #c8e06a 25%, #4aeadc 50%, #2b9cfc 75%, #8f7cf6); }
.rail .ibtn[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.rail .ibtn[aria-current="page"]::before { content: ""; position: absolute; left: -13px; top: 10px; bottom: 10px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.rail .sep { width: 22px; height: 1px; background: var(--line); margin: 8px 0; }
.rail .bot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 500 11px var(--mono); background: var(--ink); color: var(--bg); margin-top: 6px; }
.theme .i-sun, :root[data-eff="dark"] .theme .i-moon { display: none; }
:root[data-eff="dark"] .theme .i-sun { display: block; }
.page { max-width: 1480px; width: 100%; margin: 0 auto; padding: 26px 32px 64px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* ---------- Header ---------- */
.top { display: flex; align-items: center; gap: 12px; }
.crumbs { display: flex; align-items: center; gap: 8px; font: 400 12.5px var(--mono); color: var(--ink-3); }
.crumbs b { color: var(--ink-2); font-weight: 500; }
.search { margin-left: auto; display: flex; align-items: center; gap: 10px; width: 240px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink-3); font-size: 13px; cursor: pointer; text-align: left; }
.search span { flex: 1; }
.head { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.head .l { flex: 1 1 480px; min-width: 0; }
h1 { margin: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 500; font-size: 30px; line-height: 1.15; letter-spacing: -.025em; color: var(--ink); }
.state { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 13px; font: 500 11.5px var(--mono); background: var(--hover); color: var(--ink-2); }
.state.RUNNING { color: var(--accent); background: var(--accent-soft); }
.state.SUCCEEDED { color: var(--ok); background: var(--ok-soft); }
.state.CANCELLED { color: var(--err); background: var(--err-soft); }
.task { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
.head .r { display: flex; align-items: center; gap: 10px; }
.clock { font: 400 26px var(--mono); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 8px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; position: relative; display: inline-block; }
.dot.live::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; background: currentColor; opacity: 0; animation: ping 2.2s var(--ease) infinite; }
@keyframes ping { 0% { transform: scale(.4); opacity: .45; } 100% { transform: scale(1.8); opacity: 0; } }

/* ---------- Cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; overflow: hidden; }
.ch { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; min-height: 58px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
.ch h2 { margin: 0; font-size: 15px; font-weight: 500; color: var(--ink); }
.ch .n { font: 400 12px var(--mono); color: var(--ink-3); }
.ch .ok { display: inline-flex; align-items: center; gap: 6px; font: 400 12px var(--mono); color: var(--ok); }
.ch .ok .lucide { width: 14px; height: 14px; }

/* Limits as segmented meters in the stage header. */
.lims { margin-left: auto; display: flex; gap: 22px; flex-wrap: wrap; }
.lim { display: flex; flex-direction: column; gap: 5px; min-width: 70px; }
.lim small { display: flex; justify-content: space-between; gap: 10px; font: 400 11px var(--mono); color: var(--ink-3); }
.lim small b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 2px; height: 4px; }
.seg i { flex: 1; border-radius: 1px; background: var(--line-2); transition: background .3s; }
.seg i.on { background: var(--ink); }
.seg.cont { background: var(--line-2); border-radius: 2px; overflow: hidden; }
.seg.cont i { flex: none; width: var(--w, 0%); background: var(--ink); border-radius: 0; transition: width .3s linear; }

/* ---------- Execution stage ---------- */
.stage { position: relative; overflow-x: auto; overflow-y: hidden; background: var(--stage); background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 22px 22px; }
.dg { position: relative; width: 1080px; height: 460px; transform-origin: 0 0; }
.dg svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.col-h { position: absolute; top: 18px; font: 500 10.5px var(--mono); color: var(--ink-3); letter-spacing: .02em; }
.edge { fill: none; stroke: var(--line-2); stroke-width: 1.5; transition: stroke .4s, opacity .4s; }
.edge.on { stroke: color-mix(in srgb, var(--accent) 35%, transparent); }
.edge.done { stroke: color-mix(in srgb, var(--ok) 55%, var(--line-2)); }
.edge.deny { stroke: var(--err); stroke-dasharray: 3 5; }
.flow { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; opacity: 0; transition: opacity .3s; }
.flow.on { opacity: 1; }

.node { position: absolute; display: grid; grid-template-columns: 38px minmax(0, 1fr); column-gap: 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line-2); border-radius: 16px; background: var(--surface); box-shadow: var(--node-sh); cursor: pointer; text-align: left; transition: border-color .4s, opacity .4s, box-shadow .4s var(--ease), transform .3s var(--ease); }
.node:hover { transform: translateY(-1px); border-color: var(--ink-3); }
.node .ico { grid-row: span 2; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); position: relative; transition: background .4s, color .4s, border-color .4s; }
.node .ico .lucide { width: 18px; height: 18px; }
.node b { font-size: 14.5px; font-weight: 500; color: var(--ink); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .now { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 19px; }
.node .badge { position: absolute; right: -5px; bottom: -5px; width: 16px; height: 16px; border-radius: 50%; display: none; place-items: center; background: var(--ok); color: #fff; border: 2px solid var(--surface); }
.node .badge .lucide { width: 9px; height: 9px; stroke-width: 3.5; }
.node[data-st="PENDING"] { opacity: .5; box-shadow: none; border-style: dashed; }
.node[data-st="RUNNING"] { border-color: color-mix(in srgb, var(--accent) 40%, var(--line-2)); box-shadow: var(--node-sh), 0 0 0 5px var(--accent-soft); }
.node[data-st="RUNNING"] .ico { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.node[data-st="RUNNING"] .now { color: var(--accent); }
.node[data-st="RUNNING"]::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; background: conic-gradient(from var(--a), transparent 0 62%, var(--accent) 88%, transparent 100%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 2.4s linear infinite; pointer-events: none; }
@keyframes spin { to { --a: 360deg; } }
.node[data-st="SUCCEEDED"] { border-color: color-mix(in srgb, var(--ok) 35%, var(--line-2)); }
.node[data-st="SUCCEEDED"] .ico { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.node[data-st="SUCCEEDED"] .badge { display: grid; }
.node.you { grid-template-columns: 1fr; padding: 0; width: 52px; height: 52px; border-radius: 50%; place-items: center; cursor: default; font: 500 12px var(--mono); color: var(--ink); border-style: solid !important; opacity: 1 !important; }
.node.you:hover { transform: none; border-color: var(--line-2); }

.tool { position: absolute; height: 42px; display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 10px; align-items: center; padding: 0 12px 0 7px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); box-shadow: var(--node-sh); transition: opacity .45s var(--ease), transform .45s var(--ease), border-color .3s; }
.tool.hide { opacity: 0; transform: translateX(-10px) scale(.98); pointer-events: none; }
.tool .t { grid-row: span 2; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--accent-soft); color: var(--accent); }
.tool .nm { font: 500 12px var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }
.tool .rs { font: 400 11px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
.tool.RUNNING { border-color: color-mix(in srgb, var(--accent) 50%, var(--line-2)); }
.tool.RUNNING .rs { color: var(--accent); }
.tool.deny { border-color: color-mix(in srgb, var(--err) 50%, var(--line-2)); background: color-mix(in srgb, var(--err-soft) 100%, var(--surface)); }
.tool.deny .t { background: transparent; border: 1px solid color-mix(in srgb, var(--err) 45%, transparent); color: var(--err); }
.tool.deny .nm, .tool.deny .rs { color: var(--err); }

/* ---------- Lane timeline ---------- */
.lanes { padding: 14px 20px 16px; border-top: 1px solid var(--line); }
.ln { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: center; height: 26px; }
.ln > span { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 100%; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
.track .bar { position: absolute; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: var(--ink-2); min-width: 4px; }
.track .bar.run { background: var(--accent); }
.track .bar.can { background: var(--ink-3); }
.track .ev { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-2); cursor: default; }
.track .ev.run { border-color: var(--accent); }
.track .ev.ok { border-color: var(--ok); }
.track .ev.err { border: 0; background: transparent; }
.track .ev.err::before { content: ""; position: absolute; inset: 0; border-radius: 2px; background: var(--err); transform: rotate(45deg) scale(.9); }
.axis { display: grid; grid-template-columns: 132px minmax(0, 1fr); margin-top: 6px; }
.axis .ticks { position: relative; height: 16px; }
.axis .ticks span { position: absolute; transform: translateX(-50%); font: 400 10.5px var(--mono); color: var(--ink-3); }
.axis .ticks span:first-child { transform: none; }

/* ---------- Output + runs ---------- */
.lower { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
.ideas { list-style: none; margin: 0; padding: 0; }
.idea { display: grid; grid-template-columns: 34px minmax(0, 1fr) 48px; gap: 14px; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); animation: fadeIn .8s var(--ease) both; }
.idea:last-child { border-bottom: 0; }
.idea .rk { font: 400 13px var(--mono); color: var(--ink-3); }
.idea b { display: block; font-size: 14.5px; font-weight: 500; color: var(--ink); }
.idea p { margin: 2px 0 0; font-size: 13px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.idea .src { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.idea .src span { font: 400 10.5px var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.ring { width: 48px; height: 48px; position: relative; display: grid; place-items: center; font: 500 12px var(--mono); color: var(--ink); }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 3; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; animation: ringIn 1.2s var(--ease) both; animation-delay: inherit; }
@keyframes ringIn { from { stroke-dashoffset: var(--c); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }
.skel { padding: 8px 0; }
.skel div { display: grid; grid-template-columns: 34px minmax(0, 1fr) 48px; gap: 14px; align-items: center; padding: 14px 20px; }
.skel i { display: block; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--line) 0%, var(--surface-2) 50%, var(--line) 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
.skel i.c { width: 40px; height: 40px; border-radius: 50%; }
.skel i.s { width: 22px; }
.skel span { display: flex; flex-direction: column; gap: 8px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { padding: 28px 20px; color: var(--ink-3); font-size: 13.5px; display: flex; gap: 10px; align-items: center; }
.runs { list-style: none; margin: 0; padding: 4px 0; }
.runs li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 20px; border-bottom: 1px solid var(--line); font-size: 13px; }
.runs li:last-child { border-bottom: 0; }
.runs li.cur { background: var(--hover); }
.runs b { display: block; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.runs small { font: 400 11px var(--mono); color: var(--ink-3); }
.runs .t { font: 400 12px var(--mono); color: var(--ink-3); text-align: right; }
.runs .t.err { color: var(--err); }
.runs .dot.ok { color: var(--ok); } .runs .dot.run { color: var(--accent); } .runs .dot.err { color: var(--err); }

/* ---------- Drawer, dialog, toast ---------- */
dialog { padding: 0; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--pop); }
dialog::backdrop { background: rgba(0, 0, 0, .35); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
dialog.drawer { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(440px, 100vw); border-radius: 0; }
dialog.drawer[open] { display: flex; flex-direction: column; animation: slide .35s var(--ease); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.dr-h { display: flex; align-items: center; gap: 14px; padding: 22px 22px 18px; border-bottom: 1px solid var(--line); }
.dr-h .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); flex: none; }
.dr-h .ico .lucide { width: 20px; height: 20px; }
.dr-h h3 { margin: 0; font: 500 20px/1.2 var(--sans); letter-spacing: -.02em; }
.dr-h .id { font: 400 12px var(--mono); color: var(--ink-3); }
.dr-h .ibtn { margin-left: auto; }
.dr-b { padding: 4px 22px 24px; overflow-y: auto; }
.dr-sec { padding: 14px 0; border-bottom: 1px solid var(--line); }
.dr-sec:last-child { border-bottom: 0; }
.dr-sec h4 { margin: 0 0 8px; font: 500 11px var(--mono); color: var(--ink-3); }
.dr-sec p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border: 1px solid var(--line-2); border-radius: 7px; font: 400 12px var(--mono); color: var(--ink); }
.chip .lucide { width: 13px; height: 13px; }
.chip.serp { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line-2)); }
.chip.none { color: var(--ink-3); border-style: dashed; }
.code { margin: 0; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); font: 400 12px/1.6 var(--mono); color: var(--ink-2); white-space: pre-wrap; }
.kvs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kvs div { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
.kvs small { display: block; font-size: 11.5px; color: var(--ink-3); }
.kvs b { font: 500 14px var(--mono); color: var(--ink); }
dialog.modal { width: min(540px, calc(100% - 32px)); border-radius: 16px; margin-top: 12vh; }
dialog.modal[open] { animation: pop .22s var(--ease); }
@keyframes pop { from { transform: translateY(6px) scale(.985); opacity: 0; } }
.fm { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.fm h3 { margin: 0; font: 500 20px var(--sans); letter-spacing: -.02em; }
.fm label { display: flex; flex-direction: column; gap: 6px; font: 500 11.5px var(--mono); color: var(--ink-3); }
.fm select, .fm textarea, .fm input { border: 1px solid var(--line-2); border-radius: 9px; background: var(--surface); padding: 9px 11px; font: 400 14px var(--sans); color: var(--ink); outline: 0; }
.fm select:focus, .fm textarea:focus, .fm input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fm textarea { min-height: 76px; resize: vertical; }
.fm .lims-in { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.fm .lims-in input { font-family: var(--mono); font-size: 13px; padding: 7px 8px; width: 100%; }
.fm .lims-in label { font-size: 10.5px; }
.fm-f { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px; border-top: 1px solid var(--line); }
.toasts { position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; border-radius: 10px; background: var(--solid); color: var(--solid-fg); font-size: 13px; box-shadow: var(--pop); animation: tIn .4s var(--ease); white-space: nowrap; }
.toast.out { animation: tOut .22s ease-in forwards; }
@keyframes tIn { from { transform: translateY(10px); opacity: 0; } }
@keyframes tOut { to { transform: translateY(6px); opacity: 0; } }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
.rise { animation: rise .8s var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes rise { from { transform: translateY(8px); opacity: .3; } }

@media (max-width: 1180px) {
  .lower { grid-template-columns: minmax(0, 1fr); }
  .lims { margin-left: 0; width: 100%; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); padding-bottom: 60px; }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: 60px; flex-direction: row; justify-content: space-around; padding: 0 8px; border-right: 0; border-top: 1px solid var(--line); }
  .rail .mark, .rail .sep, .rail .avatar, .rail .ibtn.opt { display: none; }
  .rail .bot { margin: 0; flex-direction: row; }
  .rail .ibtn[aria-current="page"]::before { display: none; }
  [data-tip]:hover::after { display: none; }
  .page { padding: 18px 16px 40px; }
  .search { width: 36px; padding: 0; justify-content: center; }
  .search span, .search kbd { display: none; }
  .clock { font-size: 20px; }
  .ln, .axis { grid-template-columns: 96px minmax(0, 1fr); }
  .fm .lims-in { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Primary">
    <div class="mark"><span>N³</span></div>
    <a class="ibtn" href="#" aria-current="page" data-tip="Runs"><i data-lucide="play"></i></a>
    <a class="ibtn" href="#" data-tip="Agents" data-open-def="idea-consultant"><i data-lucide="bot"></i></a>
    <a class="ibtn" href="#" data-tip="Tools" data-open-def="market-scout"><i data-lucide="wrench"></i></a>
    <a class="ibtn opt" href="#" data-tip="Approvals"><i data-lucide="user-check"></i></a>
    <span class="sep"></span>
    <a class="ibtn opt" href="#" data-tip="NMC² compute · 61% GPU"><i data-lucide="server"></i></a>
    <a class="ibtn opt" href="#" data-tip="SerpAPI · 1,846 today" id="rail-serp"><i data-lucide="search"></i></a>
    <div class="bot">
      <button class="ibtn theme" type="button" id="theme" aria-label="Switch theme" data-tip="Theme"><i data-lucide="moon" class="i-moon"></i><i data-lucide="sun" class="i-sun"></i></button>
      <a class="ibtn opt" href="#" data-tip="Settings"><i data-lucide="settings-2"></i></a>
      <div class="avatar" title="Khang Doan">KD</div>
    </div>
  </nav>

  <main class="page">
    <div class="top rise">
      <div class="crumbs"><span>Runs</span><span>/</span><b id="crumb-run">run_8f2c42</b></div>
      <button class="search" type="button"><i data-lucide="search"></i><span>Search</span><kbd>⌘K</kbd></button>
    </div>

    <section class="head rise" style="--d:40ms">
      <div class="l">
        <h1><span>Idea Consultant</span><span class="state RUNNING" id="rh-state"><i class="dot live"></i>RUNNING</span></h1>
        <p class="task" id="rh-task"></p>
      </div>
      <div class="r">
        <span class="clock" id="rh-time">00:00.0</span>
        <button class="btn" type="button" id="cancel"><i data-lucide="square"></i>Cancel</button>
        <button class="btn solid" type="button" id="new-run"><i data-lucide="play"></i>New run</button>
      </div>
    </section>

    <section class="card rise" style="--d:80ms" aria-labelledby="dg-h">
      <div class="ch"><h2 id="dg-h">How this run is executing</h2><div class="lims" id="lims"></div></div>
      <div class="stage" id="stage"><div class="dg" id="dg"><svg id="wires" aria-hidden="true"></svg></div></div>
      <div class="lanes" id="lanes"></div>
    </section>

    <div class="lower">
      <section class="card rise" style="--d:140ms" aria-labelledby="out-h">
        <div class="ch"><h2 id="out-h">Output</h2><span class="ok" id="out-cap" hidden></span></div>
        <div id="output"></div>
      </section>
      <section class="card rise" style="--d:180ms" aria-labelledby="runs-h">
        <div class="ch"><h2 id="runs-h">Runs</h2><span class="n" id="runs-n"></span></div>

      </section>

</div>

<dialog class="drawer" id="def" aria-labelledby="def-name">
  <div class="dr-h"><span class="ico" id="def-ico"></span><div><h3 id="def-name"></h3><span class="id" id="def-id"></span></div><button class="ibtn" type="button" id="def-close" aria-label="Close"><i data-lucide="x"></i></button></div>
  <div class="dr-b" id="def-body"></div>
</dialog>

<dialog class="modal" id="start" aria-labelledby="start-h">
  <form class="fm" id="start-form" method="dialog">
    <h3 id="start-h">New run</h3>
    <label>Agent<select id="f-agent"><option value="idea-consultant">Idea Consultant · idea-consultant@1.0.0</option></select></label>
    <label>Task<textarea id="f-task"></textarea></label>
    <div>
      <label style="margin-bottom:6px">Limits</label>
      <div class="lims-in">
        <label>turns<input id="f-turns" type="number" min="1" value="16"></label>
        <label>tools<input id="f-tools" type="number" min="1" value="6"></label>
        <label>delegations<input id="f-dels" type="number" min="1" value="3"></label>
        <label>parallel<input id="f-par" type="number" min="1" value="2"></label>
        <label>seconds<input id="f-secs" type="number" min="5" value="60"></label>
      </div>
    </div>
  </form>
  <div class="fm-f"><button class="btn ghost" type="button" id="start-cancel">Cancel</button><button class="btn solid" type="button" id="start-go"><i data-lucide="play"></i>Start</button></div>
</dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const NS = "http://www.w3.org/2000/svg";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const icons = () => window.lucide && window.lucide.createIcons();
  const ic = n => `<i data-lucide="${n}"></i>`;
  const root = document.documentElement;
  const esc = t => String(t).replace(/[<>&"]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));

  /* ---------- Theme ---------- */
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const eff = () => root.dataset.theme || (mq.matches ? "dark" : "light");
  const sync = () => { root.dataset.eff = eff(); };
  try { const s = new URLSearchParams(location.search).get("theme") || localStorage.getItem("nmc3-theme"); if (s) root.dataset.theme = s; } catch (_) {}
  sync(); mq.addEventListener("change", sync);
  $("#theme").addEventListener("click", e => {
    const next = eff() === "dark" ? "light" : "dark";
    const apply = () => { root.dataset.theme = next; sync(); };
    try { localStorage.setItem("nmc3-theme", next); } catch (_) {}
    if (!document.startViewTransition || reduce) return apply();
    const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    document.startViewTransition(apply).ready.then(() => root.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] }, { duration: 650, easing: "cubic-bezier(0.16, 1, 0.3, 1)", pseudoElement: "::view-transition-new(root)" }));
  });
  function toast(msg) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    $("#toasts").append(t); setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 230); }, 2600);
  }

  /* ---------- Reusable definitions (mirror agents/internal/contracts AgentDefinition / ToolDefinition) ---------- */
  const TOOLS = {
    "serpapi.google_search": { icon: "globe", mark: "G", serp: true },
    "serpapi.google_patents": { icon: "scroll-text", mark: "P", serp: true },
    "serpapi.google_scholar": { icon: "graduation-cap", mark: "S", serp: true },
    "web.fetch": { icon: "link", mark: "W" },
  };
  const DEFS = {
    "idea-consultant": { name: "Idea Consultant", icon: "network", kind: "Orchestrator", depth: 0, model: "claude-opus-5-5 on NMC²", role: "Finds original, feasible product ideas for a task and returns the top 3 with sources.",
      instructions: "Split the task into research, generation and critique. Delegate each part to a specialist. Only return ideas a critic has checked, and cite every source.",
      tools: [], delegates: ["market-scout", "idea-generator", "novelty-critic"], input: "{ task: string }", output: "{ ideas: [{ title, why, novelty, source_ids[] }] }" },
    "market-scout": { name: "Market Scout", icon: "compass", kind: "Specialist", depth: 1, model: "claude-sonnet-5-5 on NMC²", role: "Maps what already exists: competitors, products and patents.",
      instructions: "Search the market and patents for the task. Return grouped sources with IDs. Do not propose ideas.",
      tools: ["serpapi.google_search", "serpapi.google_patents"], delegates: [], input: "{ task: string }", output: "{ clusters: [...], source_ids[] }" },
    "idea-generator": { name: "Idea Generator", icon: "sparkles", kind: "Specialist", depth: 1, model: "claude-opus-5-5 on NMC² GPUs", role: "Writes candidate ideas that avoid what the scout found.",
      instructions: "Use only the market map you were given. Write 12 distinct ideas. You cannot call tools or other agents.",
      tools: [], delegates: [], input: "{ task, clusters[] }", output: "{ ideas: [{ title, why }] }" },
    "novelty-critic": { name: "Novelty Critic", icon: "scale", kind: "Specialist", depth: 1, model: "claude-sonnet-5-5 on NMC²", role: "Checks each idea against published research and keeps only the original ones.",
      instructions: "Search research for each idea. Score novelty from 0 to 1. Keep ideas scoring 0.70 or higher.",
      tools: ["serpapi.google_scholar"], delegates: [], input: "{ ideas[] }", output: "{ kept: [{ title, novelty, source_ids[] }] }" },
  };
  const VERSION = "1.0.0";
  const AGENTS = ["idea-consultant", "market-scout", "idea-generator", "novelty-critic"];
  const SPECS = AGENTS.slice(1);

  /* ---------- Graph (fixed 1080 × 460 design canvas, scaled to fit) ---------- */
  const CW = 1080, CH = 460;
  const dg = $("#dg"), wires = $("#wires"), stage = $("#stage");
  const fit = () => {
    const w = stage.clientWidth, sc = Math.max(.5, Math.min(1.12, (w - 16) / CW));
    dg.style.transform = `scale(${sc})`; dg.style.marginLeft = Math.max(0, (w - CW * sc) / 2) + "px"; stage.style.height = Math.round(CH * sc) + "px";
  };
  new ResizeObserver(fit).observe(stage); fit();

  const YOU = { x: 26, y: 204, w: 52, h: 52 };
  const ORC = { x: 128, y: 190, w: 236, h: 80 };
  const SPEC_X = 478, SPEC_W = 236, SPEC_H = 76, SPEC_Y = [56, 192, 328];
  const CALL_X = 806, CALL_W = 250;
  const mid = b => b.y + b.h / 2;
  [["orchestrator", ORC.x], ["specialists", SPEC_X], ["tool calls", CALL_X]].forEach(([t, x]) => {
    const h = document.createElement("div"); h.className = "col-h"; h.style.left = x + "px"; h.textContent = t; dg.append(h);
  });
  const place = (el, b) => Object.assign(el.style, { left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px" });

  const you = document.createElement("div"); you.className = "node you"; you.textContent = "KD"; you.title = "You · POST /v1/agent-runs"; place(you, YOU); dg.append(you);
  const boxes = {};
  const specBox = i => ({ x: SPEC_X, y: SPEC_Y[i], w: SPEC_W, h: SPEC_H });
  AGENTS.forEach((id, i) => {
    const d = DEFS[id], b = document.createElement("button");
    b.type = "button"; b.className = "node"; b.dataset.st = "PENDING"; b.title = `${id}@${VERSION}`;
    b.innerHTML = `<span class="ico">${ic(d.icon)}<span class="badge">${ic("check")}</span></span><b>${d.name}</b><span class="now">Waiting</span>`;
    place(b, i === 0 ? ORC : specBox(i - 1)); b.addEventListener("click", () => openDef(id));
    dg.append(b); boxes[id] = b;
  });

  const curve = (x1, y1, x2, y2) => { const dx = (x2 - x1) * .55; return `M${x1} ${y1} C${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`; };
  // Each edge is a quiet base line plus a bright "comet" dash that travels along it while work flows.
  function mkEdge(d) {
    const base = document.createElementNS(NS, "path"); base.setAttribute("class", "edge"); base.setAttribute("d", d);
    const flow = document.createElementNS(NS, "path"); flow.setAttribute("class", "flow"); flow.setAttribute("d", d);
    wires.append(base, flow);
    const L = base.getTotalLength(), dash = Math.min(26, L * .3);
    if (reduce) flow.style.strokeDasharray = "none";
    else {
      flow.style.strokeDasharray = `${dash} ${L}`;
      flow.animate([{ strokeDashoffset: L + dash }, { strokeDashoffset: 0 }], { duration: Math.max(700, L * 4.2), iterations: Infinity });
    }
    return { base, flow, set(st) { base.setAttribute("class", "edge " + (st || "")); flow.classList.toggle("on", st === "on"); } };
  }
  const E = { you: mkEdge(curve(YOU.x + YOU.w, mid(YOU), ORC.x, mid(ORC))) };
  SPECS.forEach((id, i) => { E[id] = mkEdge(curve(ORC.x + ORC.w, mid(ORC), SPEC_X, mid(specBox(i)))); });

  const calls = [];
  function addCall(spec, slot, total, name, denied) {
    const i = SPECS.indexOf(spec), cy = mid(specBox(i)) + (slot - (total - 1) / 2) * 50, t = TOOLS[name] || {};
    const el = document.createElement("div");
    el.className = "tool hide" + (denied ? " deny" : "");
    place(el, { x: CALL_X, y: cy - 21, w: CALL_W, h: 42 });
    el.innerHTML = `<span class="t">${denied ? "×" : (t.mark || "→")}</span><span class="nm">${esc(name.replace("serpapi.", ""))}</span><span class="rs"></span>`;
    el.title = name;
    dg.append(el);
    const e = mkEdge(curve(SPEC_X + SPEC_W, mid(specBox(i)), CALL_X, cy)); e.base.style.opacity = 0;
    const c = { el, e, denied }; calls.push(c); return c;
  }
  function setCall(c, state, text) {
    c.el.classList.remove("hide", "RUNNING", "SUCCEEDED"); if (state) c.el.classList.add(state);
    $(".rs", c.el).textContent = text; c.e.base.style.opacity = 1;
    c.e.set(c.denied ? "deny" : state === "RUNNING" ? "on" : "done");
  }
  // The orchestrator's incoming edge carries flow only while it is working on its own, not while waiting on a specialist.
  function syncRootEdge() {
    const st = boxes["idea-consultant"].dataset.st, busy = SPECS.some(s => boxes[s].dataset.st === "RUNNING");
    E.you.set(st === "RUNNING" ? (busy ? "done" : "on") : st === "SUCCEEDED" ? "done" : "");
  }
  function setAgent(id, st, now) {
    const b = boxes[id]; b.dataset.st = st; $(".now", b).textContent = now;
    const lane = lanes[id], t = elapsed();
    if (st === "PENDING" && now === "Waiting") { lane.start = lane.end = null; }
    else {
      if (st === "RUNNING" && lane.start == null) lane.start = t;
      if (st !== "RUNNING" && lane.start != null && lane.end == null) lane.end = t;
    }
    lane.st = st;
    if (id !== "idea-consultant") E[id].set(st === "RUNNING" ? "on" : st === "SUCCEEDED" ? "done" : "");
    syncRootEdge();
  }

  /* ---------- Limits (segmented meters) ---------- */
  let LIM = { turns: 16, tools: 6, dels: 3, par: 2, secs: 60 };
  const used = { turns: 0, tools: 0, dels: 0, par: 0, secs: 0 };
  const LABEL = { turns: "turns", tools: "tools", dels: "delegations", par: "parallel", secs: "time" };
  function buildLimits() {
    $("#lims").innerHTML = Object.keys(LABEL).map(k => `<div class="lim"><small>${LABEL[k]}<b id="lim-${k}"></b></small><div class="seg${k === "secs" ? " cont" : ""}" id="seg-${k}">${k === "secs" ? "<i></i>" : "<i></i>".repeat(Math.min(LIM[k], 24))}</div></div>`).join("");
  }
  function renderLimits() {
    Object.keys(LABEL).forEach(k => {
      const u = k === "secs" ? Math.floor(used.secs) : used[k];
      $("#lim-" + k).textContent = k === "secs" ? `${u}s/${LIM.secs}s` : `${u}/${LIM[k]}`;
      const seg = $("#seg-" + k);
      if (k === "secs") { seg.firstChild.style.setProperty("--w", Math.min(100, used.secs / LIM.secs * 100) + "%"); return; }
      const n = seg.children.length, on = Math.round(Math.min(1, u / LIM[k]) * n);
      [...seg.children].forEach((s, j) => s.classList.toggle("on", j < on));
    });
  }

  /* ---------- Lane timeline (replaces the text event log) ---------- */
  const lanes = Object.fromEntries(AGENTS.map(id => [id, { start: null, end: null, st: "PENDING" }]));
  const events = [];
  $("#lanes").innerHTML = AGENTS.map(id => `<div class="ln"><span>${DEFS[id].name}</span><div class="track" id="tr-${id}"><i class="bar" hidden></i></div></div>`).join("") + `<div class="axis"><span></span><div class="ticks" id="ticks"></div></div>`;
  const EVC = { RUN_STARTED: "run", AGENT_STARTED: "run", TOOL_STARTED: "run", TOOL_SUCCEEDED: "ok", AGENT_SUCCEEDED: "ok", RUN_SUCCEEDED: "ok", TOOL_FAILED: "err", DELEGATION_REJECTED: "err", RUN_CANCELLED: "err" };
  function emit(type, lane, detail) {
    const e = { seq: events.length + 1, t: elapsed(), type, lane, detail };
    events.push(e);
    const dot = document.createElement("i"); dot.className = "ev " + (EVC[type] || "");
    dot.dataset.tip = `#${e.seq} ${type}${detail ? " · " + detail : ""}`;
    $("#tr-" + lane).append(dot); e.el = dot;
  }
  let lastSpan = 0;
  function renderLanes() {
    const t = elapsed(), live = state === "RUNNING";
    const span = live ? Math.max(20, Math.ceil((t + 3) / 5) * 5) : Math.max(5, Math.ceil(t));
    const x = v => (Math.min(v, span) / span * 100) + "%";
    AGENTS.forEach(id => {
      const l = lanes[id], bar = $("#tr-" + id + " .bar");
      bar.hidden = l.start == null;
      if (l.start == null) return;
      const end = l.end ?? t;
      bar.style.left = x(l.start); bar.style.width = x(end - l.start);
      bar.className = "bar" + (l.end == null && live ? " run" : l.st === "PENDING" ? " can" : "");
    });
    events.forEach(e => { e.el.style.left = x(e.t); });
    if (span !== lastSpan) {
      lastSpan = span;
      const step = span <= 20 ? 5 : span <= 40 ? 10 : 15;
      let h = "";
      for (let v = 0; v <= span + .01; v += step) h += `<span style="left:${x(v)}">${Math.round(v)}s</span>`;
      $("#ticks").innerHTML = h;
    }
  }

  /* ---------- Output ---------- */
  const RESULTS = [
    { task: "Find original product ideas for cold-chain logistics in rural clinics", counts: [10, 6, 22], ideas: [
      ["Clinic-owned cold-box rental co-op", "Clinics share solar cold boxes and split the cost, instead of each buying a fridge.", .84, ["serp-g-04", "serp-p-11"]],
      ["Vaccine temperature passports over SMS", "Each shipment texts its temperature log, so clinics without internet can still check it.", .79, ["serp-g-09", "serp-s-02"]],
      ["Moto courier relay from pharmacies", "Local couriers carry insulated boxes on fixed loops timed to clinic hours.", .72, ["serp-g-15"]] ] },
    { task: "Find original product ideas for water reuse in GPU data centers", counts: [12, 8, 17], ideas: [
      ["Cooling-tower water swap with local farms", "Data centers send warm treated water to farms in summer and get groundwater credits back.", .88, ["serp-g-03", "serp-p-07"]],
      ["Rain-to-rack storage for summer peaks", "Roof rainwater is stored for the hottest weeks, when cooling demand peaks.", .74, ["serp-g-12", "serp-s-05"]],
      ["Greywater credits for university campuses", "Campus buildings trade greywater with a nearby data center through a shared meter.", .71, ["serp-g-18"]] ] },
    { task: "Find original product ideas for AI tutoring in trade schools", counts: [9, 5, 19], ideas: [
      ["Shop-floor AR tutor for welding", "A headset overlays bead width and angle feedback while the student welds.", .81, ["serp-p-04", "serp-s-01"]],
      ["Apprentice matching from real job tickets", "Matches apprentices to mentors using the repair tickets each shop actually handles.", .77, ["serp-g-02", "serp-s-08"]],
      ["Licensing exam drills over voice", "Students practice code questions out loud during commutes, graded by the tutor.", .69, ["serp-g-10"]] ] },
  ];
  const R = 20, C = 2 * Math.PI * R;
  const ring = v => `<div class="ring"><svg viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="${R}"/><circle class="fg" cx="24" cy="24" r="${R}" style="--c:${C};stroke-dasharray:${C};stroke-dashoffset:${C * (1 - v)}"/></svg>${v.toFixed(2)}</div>`;
  function renderOutput(st, res) {
    const out = $("#output"), cap = $("#out-cap");
    cap.hidden = st !== "SUCCEEDED";
    if (st === "CANCELLED") { out.innerHTML = `<div class="empty">${ic("circle-slash")}Cancelled</div>`; icons(); return; }
    if (st !== "SUCCEEDED") {
      out.innerHTML = `<div class="skel">${'<div><i class="s"></i><span><i style="width:46%"></i><i style="width:72%;opacity:.6"></i></span><i class="c"></i></div>'.repeat(3)}</div>`;
      return;
    }
    cap.innerHTML = `${ic("badge-check")}schema valid`;
    out.innerHTML = `<ol class="ideas">${res.ideas.slice().sort((a, b) => b[2] - a[2]).map((d, k) => `<li class="idea" style="animation-delay:${k * 90}ms"><span class="rk">0${k + 1}</span><div style="min-width:0"><b>${esc(d[0])}</b><p>${esc(d[1])}</p><div class="src">${d[3].map(s => `<span>${s}</span>`).join("")}</div></div>${ring(d[2])}</li>`).join("")}</ol>`;
    icons();
  }

  /* ---------- Recent runs ---------- */
  const RECENT = [
    { id: "run_8f2c41", task: "Original ideas for farm micro-grids", st: "SUCCEEDED", t: "16.8s" },
    { id: "run_8f2a90", task: "Original ideas for smoke alerts in schools", st: "FAILED", err: "BUDGET_EXCEEDED", t: "60.0s" },
    { id: "run_8f29c3", task: "Compare fictional vendors for a support team", st: "SUCCEEDED", t: "6.4s", agent: "vendor-orchestrator" },
    { id: "run_8f2911", task: "Original ideas for senior telehealth kiosks", st: "SUCCEEDED", t: "17.5s" },
    { id: "run_8f28aa", task: "Original ideas for hospital laundry routing", st: "SUCCEEDED", t: "15.2s" },
  ];
  function renderRuns(cur) {
    const rows = (cur ? [cur] : []).concat(RECENT).slice(0, 6);
    $("#runs-n").textContent = RECENT.length + (cur ? 1 : 0);
    $("#runs").innerHTML = rows.map(r => `<li class="${r === cur ? "cur" : ""}"><i class="dot ${r.st === "RUNNING" ? "run live" : r.st === "FAILED" ? "err" : "ok"}"></i><div style="min-width:0"><b>${esc(r.task)}</b><small>${r.id}</small></div><span class="t ${r.st === "FAILED" ? "err" : ""}">${r.err ? r.err.toLowerCase() : r.t}</span></li>`).join("");
  }

  /* ---------- Simulation: one scripted run following the contract lifecycle ---------- */
  let runNo = 0x8f2c41, timers = [], t0 = performance.now(), state = "PENDING", taskIdx = 0, cur = null, serpCount = 1846;
  const elapsed = () => state === "PENDING" ? 0 : (state === "RUNNING" ? (performance.now() - t0) / 1000 * (reduce ? 4 : 1) : used.secs);
  const serp = () => { serpCount++; $("#rail-serp").dataset.tip = `SerpAPI · ${serpCount.toLocaleString("en-US")} today`; };
  function setRunState(st) {
    state = st; const el = $("#rh-state"); el.className = "state " + st;
    el.innerHTML = `<i class="dot${st === "RUNNING" ? " live" : ""}"></i>${st}`;
    $("#cancel").hidden = st !== "RUNNING";
  }
  function startRun(task) {
    timers.forEach(clearTimeout); timers = [];
    const res = RESULTS.find(r => r.task === task) || { ...RESULTS[taskIdx % RESULTS.length], task };
    calls.splice(0).forEach(c => { c.el.remove(); c.e.base.remove(); c.e.flow.remove(); });
    events.splice(0).forEach(e => e.el.remove());
    Object.keys(used).forEach(k => (used[k] = 0));
    state = "PENDING"; AGENTS.forEach(id => setAgent(id, "PENDING", "Waiting")); lastSpan = 0;
    runNo++; const id = "run_" + runNo.toString(16);
    $("#crumb-run").textContent = id; $("#rh-task").textContent = task;
    cur = { id, task, st: "RUNNING", t: "…" }; renderRuns(cur);
    buildLimits(); renderLimits(); renderOutput("RUNNING"); t0 = performance.now(); setRunState("RUNNING");
    const [g, p, s] = res.counts;
    const at = (ms, fn) => timers.push(setTimeout(fn, reduce ? ms / 4 : ms));
    const bump = k => { used[k]++; renderLimits(); };
    const par = n => { used.par = n; renderLimits(); };
    const c1 = addCall("market-scout", 0, 2, "serpapi.google_search");
    const c2 = addCall("market-scout", 1, 2, "serpapi.google_patents");
    const c3 = addCall("idea-generator", 0, 1, "delegate → market-scout", true);
    const c4 = addCall("novelty-critic", 0, 2, "serpapi.google_scholar");
    const c5 = addCall("novelty-critic", 1, 2, "web.fetch", true);
    icons();
    at(0, () => emit("RUN_STARTED", "idea-consultant"));
    at(300, () => { setAgent("idea-consultant", "RUNNING", "Planning"); emit("AGENT_STARTED", "idea-consultant", "depth 0"); bump("turns"); });
    at(1300, () => { setAgent("market-scout", "RUNNING", "Planning"); setAgent("idea-consultant", "RUNNING", "Delegating"); bump("dels"); par(1); bump("turns"); emit("AGENT_STARTED", "market-scout", "depth 1"); });
    at(2000, () => { setCall(c1, "RUNNING", "searching…"); bump("tools"); setAgent("market-scout", "RUNNING", "Searching the web"); emit("TOOL_STARTED", "market-scout", "google_search"); });
    at(3400, () => { setCall(c1, "SUCCEEDED", `${g} results · 1.2s`); serp(); bump("turns"); emit("TOOL_SUCCEEDED", "market-scout", `google_search · ${g}`); });
    at(3600, () => { setCall(c2, "RUNNING", "searching…"); bump("tools"); setAgent("market-scout", "RUNNING", "Searching patents"); emit("TOOL_STARTED", "market-scout", "google_patents"); });
    at(5000, () => { setCall(c2, "SUCCEEDED", `${p} patents · 1.3s`); serp(); emit("TOOL_SUCCEEDED", "market-scout", `google_patents · ${p}`); });
    at(5400, () => { setAgent("market-scout", "SUCCEEDED", `${g + p} sources`); par(0); emit("AGENT_SUCCEEDED", "market-scout"); });
    at(6000, () => { setAgent("idea-generator", "RUNNING", "Writing ideas"); bump("dels"); par(1); bump("turns"); emit("AGENT_STARTED", "idea-generator", "depth 1"); });
    at(7800, () => { setCall(c3, "", "blocked · depth limit"); bump("turns"); emit("DELEGATION_REJECTED", "idea-generator", "DELEGATION_DEPTH_EXCEEDED"); });
    at(9800, () => { setAgent("idea-generator", "SUCCEEDED", "12 ideas"); par(0); emit("AGENT_SUCCEEDED", "idea-generator"); });
    at(10400, () => { setAgent("novelty-critic", "RUNNING", "Checking novelty"); bump("dels"); par(1); bump("turns"); emit("AGENT_STARTED", "novelty-critic", "depth 1"); });
    at(11000, () => { setCall(c4, "RUNNING", "searching…"); bump("tools"); emit("TOOL_STARTED", "novelty-critic", "google_scholar"); });
    at(12500, () => { setCall(c4, "SUCCEEDED", `${s} papers · 1.5s`); serp(); bump("turns"); emit("TOOL_SUCCEEDED", "novelty-critic", `google_scholar · ${s}`); });
    at(13100, () => { setCall(c5, "", "blocked · not allowed"); emit("TOOL_FAILED", "novelty-critic", "TOOL_NOT_ALLOWED"); });
    at(14600, () => { setAgent("novelty-critic", "SUCCEEDED", "Kept 3 of 12"); par(0); emit("AGENT_SUCCEEDED", "novelty-critic"); });
    at(15300, () => { setAgent("idea-consultant", "RUNNING", "Ranking"); bump("turns"); });
    at(16000, () => { setAgent("idea-consultant", "SUCCEEDED", "3 ideas"); emit("AGENT_SUCCEEDED", "idea-consultant"); });
    at(16300, () => {
      used.secs = elapsed(); emit("RUN_SUCCEEDED", "idea-consultant", `${used.secs.toFixed(1)}s`);
      setRunState("SUCCEEDED"); renderOutput("SUCCEEDED", res); lastSpan = 0; renderLanes();
      RECENT.unshift({ ...cur, st: "SUCCEEDED", t: used.secs.toFixed(1) + "s" }); cur = null; renderRuns();
      toast("Run succeeded");
    });
    at(28000, () => { taskIdx++; startRun(RESULTS[taskIdx % RESULTS.length].task); });
  }
  (function clock() {
    if (state === "RUNNING") {
      used.secs = elapsed();
      const s = used.secs; $("#rh-time").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${(s % 60).toFixed(1).padStart(4, "0")}`;
      renderLimits(); renderLanes();
    }
    setTimeout(clock, 100);
  })();
  $("#cancel").addEventListener("click", () => {
    if (state !== "RUNNING") return;
    timers.forEach(clearTimeout); timers = [];
    used.secs = elapsed();
    AGENTS.forEach(id => { if (boxes[id].dataset.st === "RUNNING") setAgent(id, "PENDING", "Cancelled"); });
    calls.forEach(c => { if (c.el.classList.contains("RUNNING")) c.e.set(""); });
    emit("RUN_CANCELLED", "idea-consultant");
    setRunState("CANCELLED"); renderOutput("CANCELLED"); lastSpan = 0; renderLanes();
    RECENT.unshift({ ...cur, st: "FAILED", err: "CANCELLED", t: used.secs.toFixed(1) + "s" }); cur = null; renderRuns();
    toast("Run cancelled");
  });

  /* ---------- Definition drawer ---------- */
  const def = $("#def");
  function openDef(id) {
    const d = DEFS[id];
    $("#def-ico").innerHTML = ic(d.icon);
    $("#def-name").textContent = d.name; $("#def-id").textContent = `${id}@${VERSION} · ${d.kind.toLowerCase()} · depth ${d.depth}`;
    const tools = d.tools.length ? d.tools.map(t => `<span class="chip${TOOLS[t].serp ? " serp" : ""}">${ic(TOOLS[t].icon)}${t}</span>`).join("") : `<span class="chip none">none</span>`;
    const dels = d.delegates.length ? d.delegates.map(t => `<span class="chip">${ic(DEFS[t].icon)}${t}</span>`).join("") : `<span class="chip none">none</span>`;
    $("#def-body").innerHTML = `
      <div class="dr-sec"><h4>Role</h4><p>${esc(d.role)}</p></div>
      <div class="dr-sec"><h4>Model</h4><p>${esc(d.model)}</p></div>
      <div class="dr-sec"><h4>Instructions</h4><p>${esc(d.instructions)}</p></div>
      <div class="dr-sec"><h4>Tools</h4><div class="chips">${tools}</div></div>
      <div class="dr-sec"><h4>Delegates</h4><div class="chips">${dels}</div></div>
      <div class="dr-sec"><h4>Schema</h4><pre class="code">${esc(d.input)}\n→ ${esc(d.output)}</pre></div>
      <div class="dr-sec"><h4>Limits</h4><div class="kvs"><div><small>Model turns</small><b>${d.depth ? 4 : 16}</b></div><div><small>Tool calls</small><b>${d.tools.length ? 3 : 0}</b></div><div><small>Timeout</small><b>${d.depth ? 20 : 60}s</b></div><div><small>Side effects</small><b>READ_ONLY</b></div></div></div>`;
    icons(); def.showModal();
  }
  $("#def-close").addEventListener("click", () => def.close());
  def.addEventListener("click", e => { if (e.target === def) def.close(); });
  $$("[data-open-def]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openDef(a.dataset.openDef); }));

  /* ---------- New run ---------- */
  const start = $("#start");
  $("#new-run").addEventListener("click", () => { $("#f-task").value = RESULTS[(taskIdx + 1) % RESULTS.length].task; start.showModal(); $("#f-task").focus(); });
  $("#start-cancel").addEventListener("click", () => start.close());
  start.addEventListener("click", e => { if (e.target === start) start.close(); });
  $("#start-go").addEventListener("click", () => {
    const task = $("#f-task").value.trim(); if (!task) { $("#f-task").focus(); return; }
    LIM = { turns: +$("#f-turns").value || 16, tools: +$("#f-tools").value || 6, dels: +$("#f-dels").value || 3, par: +$("#f-par").value || 2, secs: +$("#f-secs").value || 60 };
    start.close(); const k = RESULTS.findIndex(r => r.task === task); if (k >= 0) taskIdx = k;
    startRun(task); toast("Run started");
  });

  icons();
  startRun(RESULTS[0].task);
})();
</script>
</body>
</html>

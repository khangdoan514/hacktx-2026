# Website, application API, private agent process, and Postgres.
# The agent port is not published. Call it through http://localhost:8000/agent-api.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nmc3
      POSTGRES_PASSWORD: nmc3-local
      POSTGRES_DB: hacktx_nmc3
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./script/docker/init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmc3 -d hacktx_nmc3"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54330}:5432"

  minio:
    # Upstream MinIO community images are no longer publicly available.
    # PGSTY Silo is a maintained, S3-compatible MinIO fork.
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-nmc3-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-nmc3-local-secret}
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: .
      dockerfile: script/docker/api.Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgres://nmc3:nmc3-local@postgres:5432/hacktx_nmc3?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      JWT_ISSUER: ${JWT_ISSUER:-https://vocvwmiypifqnncxhfpj.supabase.co/auth/v1}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-authenticated}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-https://vocvwmiypifqnncxhfpj.supabase.co/auth/v1/.well-known/jwks.json}
      ALLOW_LOCAL_AUTH: "true"
      AGENT_EXECUTION_MODE: dummy
      ADDR: ":8000"
      STORAGE_DIR: /app/var/storage
      NMC3_INTERNAL_TOKEN: ${NMC3_INTERNAL_TOKEN:-local-internal}
      # Host .env sets AGENT_API_URL to 127.0.0.1 for a process on the machine.
      # Inside this network the agent is the agent service. Set
      # COMPOSE_AGENT_API_URL only when the agent runs on the host instead.
      AGENT_API_URL: ${COMPOSE_AGENT_API_URL:-http://agent:8080}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:-}
      GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-http://localhost:3010/api/v1/github/oauth/callback}
      GITHUB_APP_CONSOLE_URL: ${GITHUB_APP_CONSOLE_URL:-http://localhost:3010}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_SCOPE_SIGNING_KEY: ${GITHUB_SCOPE_SIGNING_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  agent:
    build:
      context: .
      dockerfile: script/docker/agent.Dockerfile
    environment:
      NMC3_STORE: postgres
      DATABASE_URL: postgres://nmc3:nmc3-local@postgres:5432/hacktx_nmc3_agent?sslmode=disable
      NMC3_DATABASE_URL: postgres://nmc3:nmc3-local@postgres:5432/hacktx_nmc3_agent?sslmode=disable
      NMC3_ADDR: 0.0.0.0:8080
      NMC3_WORKDIR: ${NMC3_WORKDIR:-/workspace/agents}
      # Absolute and under the shared mount: host OpenCode reads the generated
      # per-employee config, so a path inside the container is not visible.
      NMC3_TOOLS_DIR: ${NMC3_TOOLS_DIR:-${NMC3_WORKDIR:-/workspace/agents}/.nmc3}
      NMC3_INTERNAL_TOKEN: ${NMC3_INTERNAL_TOKEN:-local-internal}
      # The host OpenCode process must listen on 0.0.0.0:49374. 127.0.0.1 is
      # not reachable from this container.
      OPENCODE_SERVICE_FILE: /run/opencode/service.json
      OPENCODE_URL: ${OPENCODE_DOCKER_URL:-http://host.docker.internal:49374}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-opencode/beam-free}
      OPENCODE_SERVICE_PASSWORD: ${OPENCODE_SERVICE_PASSWORD:-}
      NMC3_APP_API_URL: http://api:8000
      NMC3_DEFINITIONS_FILE: ${NMC3_WORKDIR:-/workspace/agents}/examples/definitions.json
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-nmc3-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-nmc3-local-secret}
      S3_BUCKET: ${S3_BUCKET:-nmc3-threads}
      S3_USE_SSL: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Read the current OpenCode service registration, which can rotate.
      - ${HOME}/.config/opencode/service.json:/run/opencode/service.json:ro
      # OpenCode runs on the host and resolves this absolute directory there.
      # Mounting at the same path lets the agent container validate and use it.
      - ${PROJECT_ROOT:-/workspace}:${PROJECT_ROOT:-/workspace}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: script/docker/web.Dockerfile
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL-https://vocvwmiypifqnncxhfpj.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_LOCAL_AUTH: "true"
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3010}:3000"
      - "3000:3000"

volumes:
  pgdata:
  objectdata:
